<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">K3V3 on Vera Rubin LUT-B: one recipe, two attention cache architectures</title>
  <desc id="desc">Top band: the shared K3V3 recipe. Offline Lloyd-Max codebooks with optional OSCAR rotation pack KV into 3-bit LUT-B granules once; decode runs two UTCQMMA.LUTB matrix multiplies with MXFP8 Q and P as A operands, FP32 softmax between them, and a BF16 sink/recent bypass. Bottom panels: GQA compresses separate K-transpose and V caches with two codebooks; MLA compresses one shared 512-d latent with one codebook that feeds both multiplies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9f1"/>
      <stop offset="1" stop-color="#f4f1e4"/>
    </linearGradient>
    <linearGradient id="rubin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cache" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e293b" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 31px Inter, "Noto Sans SC", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px Inter, "Noto Sans SC", Arial, sans-serif; fill: #475569; }
      .panel-title { font: 700 22px Inter, "Noto Sans SC", Arial, sans-serif; fill: #1e293b; }
      .band-title { font: 700 18px Inter, "Noto Sans SC", Arial, sans-serif; fill: #4c1d95; }
      .label { font: 700 16px Inter, "Noto Sans SC", Arial, sans-serif; fill: #172033; }
      .small { font: 500 13px Inter, "Noto Sans SC", Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 11.5px Inter, "Noto Sans SC", Arial, sans-serif; fill: #64748b; }
      .mono { font: 700 15px "JetBrains Mono", Menlo, monospace; }
      .white { fill: #fff; }
      .step { font: 800 15px Inter, Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .line { fill: none; stroke: #475569; stroke-width: 2.7; marker-end: url(#arrow); }
      .purple-line { fill: none; stroke: #7c3aed; stroke-width: 3; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="48" y="54" class="title">K3V3 on Rubin LUT-B: one recipe, two cache architectures</text>
  <text x="48" y="86" class="subtitle">Pack compressed KV once, decode with two in-core lookups | GQA compresses separate K/V, MLA compresses one shared latent</text>

  <!-- ======================= shared recipe band ======================= -->
  <rect x="44" y="110" width="1512" height="212" rx="20" fill="#ffffff" stroke="#c4b5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="146" class="band-title">SHARED RECIPE &#8212; write the cache once, read it at every decode step</text>

  <!-- write path row -->
  <rect x="70" y="164" width="320" height="60" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="230" y="188" class="label" text-anchor="middle">Offline per-layer Lloyd-Max</text>
  <text x="230" y="210" class="small" text-anchor="middle">8 E4M3 centroids &#183; optional OSCAR R + clip</text>
  <path d="M390 194 H424" class="line"/>
  <rect x="427" y="164" width="368" height="60" rx="12" fill="url(#cache)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="611" y="188" class="label" text-anchor="middle">Pack 3-bit LUT-B granules</text>
  <text x="611" y="210" class="small" text-anchor="middle">512 &#215; 3-bit idx + 8 &#215; E4M3 LUT = 200 B &#8594; 3.125 bit/value</text>
  <path d="M795 194 H829" class="line"/>
  <rect x="832" y="164" width="290" height="60" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="977" y="188" class="label" text-anchor="middle">BF16 safety window</text>
  <text x="977" y="210" class="small" text-anchor="middle">sink 64 + recent 256 + unfinished blocks</text>
  <rect x="1152" y="164" width="380" height="60" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1342" y="188" class="label" text-anchor="middle">Runtime writes are cheap</text>
  <text x="1342" y="210" class="small" text-anchor="middle">no fitting at serving time &#8212; only nearest-index assignment</text>

  <!-- decode path row -->
  <rect x="70" y="244" width="250" height="60" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="195" y="268" class="label" text-anchor="middle">A: Q, then P &#183; MXFP8</text>
  <text x="195" y="290" class="small" text-anchor="middle">E4M3 + UE8M0 block32 scale</text>
  <path d="M320 274 H354" class="line"/>
  <rect x="357" y="244" width="330" height="60" rx="12" fill="url(#rubin)"/>
  <text x="522" y="269" class="mono white" text-anchor="middle">UTCQMMA.LUTB &#215; 2</text>
  <text x="522" y="291" class="small white" text-anchor="middle">lookup + multiply inside the Tensor Core</text>
  <path d="M687 274 H721" class="line"/>
  <rect x="724" y="244" width="290" height="60" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="869" y="268" class="label" text-anchor="middle">FP32 softmax between MMAs</text>
  <text x="869" y="290" class="small" text-anchor="middle">max / exp / sum &#183; P stays on chip</text>
  <rect x="1044" y="244" width="488" height="60" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1288" y="268" class="label" text-anchor="middle">B is the only compressed operand</text>
  <text x="1288" y="290" class="small" text-anchor="middle">collector reuse B_KEEP &#8594; B_REUSE serves 4 GQA Q heads per K/V tile</text>

  <!-- ======================= GQA panel ======================= -->
  <rect x="44" y="346" width="736" height="464" rx="22" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="72" y="384" class="panel-title">GQA / MHA &#8212; two caches, two codebooks</text>
  <text x="72" y="410" class="small">Qwen &amp; Gemma full attention &#183; optional independent R_k / R_v</text>

  <circle cx="88" cy="466" r="17" fill="#0f766e"/>
  <text x="88" y="466" class="step">1</text>
  <rect x="116" y="440" width="112" height="52" rx="11" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="172" y="463" class="label" text-anchor="middle">K post-RoPE</text>
  <text x="172" y="483" class="tiny" text-anchor="middle">rotate with R_k</text>
  <rect x="116" y="506" width="112" height="52" rx="11" fill="#dcfce7" stroke="#22c55e"/>
  <text x="172" y="529" class="label" text-anchor="middle">V</text>
  <text x="172" y="549" class="tiny" text-anchor="middle">rotate with R_v</text>
  <path d="M228 466 H286" class="line"/>
  <path d="M228 532 H252 V488 H286" class="line"/>
  <rect x="289" y="440" width="196" height="118" rx="14" fill="#faf5ff" stroke="#a855f7"/>
  <text x="387" y="472" class="label" text-anchor="middle">quantize offline</text>
  <text x="387" y="497" class="small" text-anchor="middle">K codebook + R_k</text>
  <text x="387" y="519" class="small" text-anchor="middle">V codebook + R_v</text>
  <text x="387" y="543" class="tiny" text-anchor="middle">sink / recent bypass in BF16</text>
  <path d="M485 499 H523" class="purple-line"/>
  <rect x="526" y="440" width="228" height="118" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="640" y="470" class="label" text-anchor="middle">two LUT-B caches</text>
  <text x="640" y="496" class="small" text-anchor="middle">INT3 K^T &#8594; B of MMA 1</text>
  <text x="640" y="519" class="small" text-anchor="middle">INT3 V &#8594; B of MMA 2</text>
  <text x="640" y="543" class="tiny" text-anchor="middle">K stored physically transposed</text>

  <circle cx="88" cy="626" r="17" fill="#2563eb"/>
  <text x="88" y="626" class="step">2</text>
  <rect x="116" y="600" width="86" height="52" rx="11" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="159" y="632" class="label" text-anchor="middle">Q</text>
  <path d="M202 626 H234" class="line"/>
  <rect x="237" y="590" width="150" height="72" rx="13" fill="url(#rubin)"/>
  <text x="312" y="619" class="label white" text-anchor="middle">Q &#215; K^T</text>
  <text x="312" y="642" class="tiny white" text-anchor="middle">LUT-B MMA 1</text>
  <path d="M387 626 H417" class="line"/>
  <circle cx="439" cy="626" r="17" fill="#f97316"/>
  <text x="439" y="626" class="step">3</text>
  <rect x="464" y="600" width="102" height="52" rx="11" fill="#ffedd5" stroke="#f97316"/>
  <text x="515" y="632" class="label" text-anchor="middle">FP32 P</text>
  <path d="M566 626 H596" class="line"/>
  <circle cx="618" cy="626" r="17" fill="#7c3aed"/>
  <text x="618" y="626" class="step">4</text>
  <rect x="643" y="590" width="111" height="72" rx="13" fill="url(#rubin)"/>
  <text x="698" y="619" class="label white" text-anchor="middle">P &#215; V</text>
  <text x="698" y="642" class="tiny white" text-anchor="middle">LUT-B MMA 2</text>

  <rect x="116" y="700" width="638" height="72" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="435" y="729" class="label" text-anchor="middle">Result: standard attention output (optional inverse R_v)</text>
  <text x="435" y="754" class="small" text-anchor="middle">Two caches per layer &#183; one K/V tile serves 4 Q heads via B_KEEP &#8594; B_REUSE</text>

  <!-- ======================= MLA panel ======================= -->
  <rect x="820" y="346" width="736" height="464" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="848" y="384" class="panel-title">MLA &#8212; one shared latent, one codebook</text>
  <text x="848" y="410" class="small">Kimi K3 &#183; 24 Gated-MLA layers &#183; rotation absorbed into projections</text>

  <circle cx="864" cy="466" r="17" fill="#0f766e"/>
  <text x="864" y="466" class="step">1</text>
  <rect x="892" y="440" width="160" height="60" rx="11" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="972" y="466" class="label" text-anchor="middle">c_KV latent</text>
  <text x="972" y="488" class="small" text-anchor="middle">512-d, shared by K and V</text>
  <path d="M1052 470 H1090" class="line"/>
  <rect x="1093" y="440" width="196" height="60" rx="11" fill="#faf5ff" stroke="#a855f7"/>
  <text x="1191" y="466" class="label" text-anchor="middle">quantize offline</text>
  <text x="1191" y="488" class="small" text-anchor="middle">one codebook + one R_latent</text>
  <path d="M1289 470 H1327" class="purple-line"/>
  <rect x="1330" y="434" width="200" height="72" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1430" y="460" class="label" text-anchor="middle">one INT3 latent</text>
  <text x="1430" y="482" class="small" text-anchor="middle">B of MMA 1 as c_KV^T</text>
  <text x="1430" y="500" class="small" text-anchor="middle">B of MMA 2 as c_KV</text>
  <rect x="892" y="520" width="638" height="44" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="1211" y="547" class="small" text-anchor="middle">Native bypass: 69 KDA states + 64-d RoPE suffix are never quantized</text>

  <circle cx="864" cy="626" r="17" fill="#2563eb"/>
  <text x="864" y="626" class="step">2</text>
  <rect x="892" y="600" width="122" height="52" rx="11" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="953" y="625" class="label" text-anchor="middle">absorbed Q</text>
  <text x="953" y="645" class="tiny" text-anchor="middle">latent basis + RoPE term</text>
  <path d="M1014 626 H1046" class="line"/>
  <rect x="1049" y="590" width="150" height="72" rx="13" fill="url(#rubin)"/>
  <text x="1124" y="619" class="label white" text-anchor="middle">Q &#215; c_KV^T</text>
  <text x="1124" y="642" class="tiny white" text-anchor="middle">LUT-B MMA 1</text>
  <path d="M1199 626 H1229" class="line"/>
  <circle cx="1251" cy="626" r="17" fill="#f97316"/>
  <text x="1251" y="626" class="step">3</text>
  <rect x="1276" y="600" width="102" height="52" rx="11" fill="#ffedd5" stroke="#f97316"/>
  <text x="1327" y="632" class="label" text-anchor="middle">FP32 P</text>
  <path d="M1378 626 H1408" class="line"/>
  <circle cx="1430" cy="626" r="17" fill="#7c3aed"/>
  <text x="1430" y="626" class="step">4</text>
  <rect x="1455" y="590" width="75" height="72" rx="13" fill="url(#rubin)"/>
  <text x="1492" y="619" class="label white" text-anchor="middle">P &#215;</text>
  <text x="1492" y="642" class="tiny white" text-anchor="middle">c_KV</text>

  <rect x="892" y="700" width="638" height="72" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1211" y="729" class="label" text-anchor="middle">Value up-projection &#8594; attention output</text>
  <text x="1211" y="754" class="small" text-anchor="middle">One cache and one codebook per layer &#183; expanded K/V never materialized</text>

  <!-- ======================= footer legend ======================= -->
  <rect x="240" y="834" width="1120" height="40" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="270" cy="854" r="7" fill="#3b82f6"/>
  <text x="284" y="859" class="tiny">A: MXFP8 Q / P</text>
  <circle cx="420" cy="854" r="7" fill="#8b5cf6"/>
  <text x="434" y="859" class="tiny">B: 3-bit LUT-B cache</text>
  <circle cx="600" cy="854" r="7" fill="#f97316"/>
  <text x="614" y="859" class="tiny">FP32 softmax</text>
  <circle cx="742" cy="854" r="7" fill="#f59e0b"/>
  <text x="756" y="859" class="tiny">BF16 / native bypass</text>
  <text x="920" y="859" class="tiny">Same Rubin rule in both panels: MXFP8 A &#215; INT3 LUT-B B, twice per layer</text>
</svg>
